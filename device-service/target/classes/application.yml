server:
  port: 8081

spring:
  #  flyway:
  #    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/home_energy_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always